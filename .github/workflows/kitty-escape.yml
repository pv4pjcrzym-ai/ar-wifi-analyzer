name: Kitty Escape

on:
  push:
    paths:
      - "KittyEscape/**"
      - ".github/workflows/kitty-escape.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Level logic tests
        run: |
          swiftc -O \
            KittyEscape/KittyEscape/Board.swift \
            KittyEscape/KittyEscape/LevelGenerator.swift \
            KittyEscape/LogicTests/main.swift \
            -o logic-tests
          ./logic-tests

      - name: Build app for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project KittyEscape/KittyEscape.xcodeproj \
            -target KittyEscape \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/build" \
            | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Screenshots in the simulator
        run: KittyEscape/ci/screenshots.sh build/Debug-iphonesimulator/KittyEscape.app

      - name: Publish screenshots to the ci-screenshots branch
        run: |
          cd screenshots
          git init -q
          git checkout -q -b ci-screenshots
          git add .
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Upload build log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build.log
            screenshots/
          if-no-files-found: ignore
